{ factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "my-default-sink"
            node.description       = "my-default-sink"
            media.class            = "Audio/Sink"
            api.alsa.path          = "hw:0,1"
            # multi-channels setting
            # audio.channels         = 16
            # audio.position       = [ FL FR FC LFE SL SR RL RR TFL TFR TRL TRR TSL TSR FLC FRC ]
            audio.channels         = 12
            audio.position         = [ FL FR FC LFE SL SR RL RR TFL TFR TRL TRR ]
        }
}

]

context.modules = [
{   name = libpipewire-module-combine-stream
    args = {
        combine.mode = sink
        node.name = "my-combine-sink"
        node.description = "my-combine-sink"
        combine.latency-compensate = true
        combine.props = {
            audio.position = [ FL FR FC LFE SL SR RL RR TFL TFR TRL TRR ]
        }
        stream.props = {
            stream.dont-remix = true
        }
        stream.rules = [
            {
                matches = [
                    {
                        media.class = "Audio/Sink"
                        node.name = "my-default-sink"
                    }
                ]
                actions = {
                    create-stream = {
                        combine.audio.position = [ FL FR FC LFE SL SR RL RR TFL TFR TRL TRR ]
                        audio.position = [ FL FR FC LFE SL SR RL RR TFL TFR TRL TRR ]
                    }
                }
            }
        ]
    }
}
]



