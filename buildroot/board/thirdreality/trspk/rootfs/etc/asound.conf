pcm.hw01 {
    type hw
    card 0
    device 1
}

pcm.hw02 {
    type hw
    card 0
    device 2
}

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "hw:0,1"
    }
    capture.pcm {
        type plug
        slave.pcm "hw:0,2"
    }
}

ctl.!default {
    type hw
    card 0
}